appId: com.photoallisai.desktop
productName: PhotoAllIsAI
artifactName: PhotoAllIsAI-${version}-${os}-${arch}.${ext}
directories:
  output: ../../release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
compression: maximum
afterSign: apps/desktop/build/after-sign.cjs
fileAssociations:
  - ext: [jpg, jpeg, png, webp, gif, avif, bmp, ico, heic, heif, tif, tiff, dng, cr2, cr3, nef, nrw, arw, raf, rw2, orf, pef]
    name: Image
    role: Viewer
mac:
  category: public.app-category.photography
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
